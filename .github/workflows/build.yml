name: Сборка APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Проверка кода
        uses: actions/checkout@v3

      - name: Настройка Python
        uses: actions/setup-python@v4
        with:
          python-cache-dependency-path: 'streamlit_app.py'

      - name: Установка системных зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libsqlite3-dev libbz2-dev libffi-dev ssl-cert cmake

      - name: Установка Buildozer и Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Запуск сборки APK
        run: |
          yes | buildozer -v android debug
